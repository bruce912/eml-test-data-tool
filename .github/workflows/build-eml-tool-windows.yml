name: Build EML Tool for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'eml-tool-v*'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eml-test-data-tool/package-lock.json
      - name: Install dependencies
        working-directory: eml-test-data-tool
        run: npm ci
      - name: Test
        working-directory: eml-test-data-tool
        run: npm test
      - name: Build portable and installer
        working-directory: eml-test-data-tool
        run: npm run dist:win:all
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eml-test-data-tool-windows-x64
          path: eml-test-data-tool/release/*.exe
          if-no-files-found: error
          retention-days: 30
